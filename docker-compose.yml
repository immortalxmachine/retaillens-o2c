# docker compose up --build
#   db        PostgreSQL 16 on host port 5440
#   pipeline  one-off: Olist data -> SAP mapping -> staging -> DQ -> star schema -> KPIs
#             (committed real sample by default; set RETAILLENS_RAW_DIR=data/raw in .env
#              after `python -m src.download` to use the full dataset)
#   dashboard Streamlit on http://localhost:8530
name: retaillens

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-retaillens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-retaillens}
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-retaillens}"]
      interval: 5s
      retries: 10

  pipeline:
    build: .
    command: ["python", "-m", "src.pipeline"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-retaillens}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-retaillens}
      RETAILLENS_RAW_DIR: ${RETAILLENS_RAW_DIR:-data/sample}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./powerbi:/app/powerbi
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-retaillens}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-retaillens}
    ports:
      - "8530:8530"
    depends_on:
      pipeline:
        condition: service_completed_successfully

volumes:
  pgdata:
